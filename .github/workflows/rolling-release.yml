# gemeinstrom-Fork-Variante des upstream-Workflows (eegfaktura/*).
# Delta zum Upstream (bei jedem Upstream-Sync neu anwenden):
#   - Push nach ghcr.io/gemeinstrom/* statt ghcr.io/vfeeg-development/*
#   - Registry-Login mit GITHUB_TOKEN statt VFEEG_DEV_PUSH_PAT (same-org push)
#   - dispatch-*-Jobs zum Platform-Repo in vfeeg-development entfernt, kein env/**-Trigger
# Die Kommentare unterhalb stammen aus dem Upstream und beschreiben dessen Ziel-Org.

# Ersetzt die seit Mai 2026 4x rote rolling-release.yml.
#
# Build-Flow:
#   1. setup-pnpm (Version aus packageManager in package.json) + setup-node (nvmrc)
#   2. pnpm install --frozen-lockfile (exakt pnpm-lock.yaml)
#   3. pnpm run build (tsc && vite build -> dist/)
#   4. docker/build-push-action -> ghcr.io/vfeeg-development/vfeeg-web
#      (keycloak-config.json ist als Caddy-Env-Template eingecheckt und wird
#      via `ADD keycloak-config.json /srv` gebacken; Caddy rendert es zur
#      Laufzeit aus KEYCLOAK_URL/_REALM/_CLIENT_ID — kein Runtime-Mount noetig)
#   5. Build-Provenance-Attestation
#   6. dispatch-deploy -> repository_dispatch deploy-web ans Platform-Repo
#
# STUFE 3 (2026-06-18): Development-Tier (ADR-0005). Image pusht nach
# `ghcr.io/vfeeg-development/vfeeg-web` (Login via VFEEG_DEV_PUSH_PAT), und der
# dispatch-deploy-Job triggert den Cluster-Rollout (Platform deploy-on-dispatch.yml,
# event_type deploy-web). Prod-Release-Tier eegfaktura/* bleibt unberuehrt.
#
# Vorbedingung Stufe 3 (beide im eegfaktura-web-Repo gesetzt):
#   - VFEEG_DEV_PUSH_PAT  (Classic-PAT mit write:packages auf vfeeg-development)
#   - PLATFORM_DEPLOY_PAT (fine-grained, repository_dispatch aufs Platform-Repo)

name: Docker Image CI

on:
  push:
    branches:
      - master
      - main
      - 'preview/**'
    tags:
      - v*
    # a commit that only changes the CHANGELOG (release PR) builds no image; the release promotes the image of the
    # commit before (platform#239). Tag pushes still build: path filters do not apply to tags.
    paths-ignore: ['CHANGELOG.md']
  # ready_for_review: a draft gets no image build; it runs once the PR is marked ready
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - master
      - main
    # a pull request that only changes the CHANGELOG (release PR) builds no image either (platform#239)
    paths-ignore: ['CHANGELOG.md']

env:
  REGISTRY: "ghcr.io"
  # Development-Tier (ADR-0005): Dev-Cluster zieht aus vfeeg-development/vfeeg-web.
  IMAGE_NAME: "gemeinstrom/eegfaktura-web"
jobs:
  build-and-push-image:
    # pull requests: not while a draft (pr-checks.yml tests drafts)
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build SPA (tsc && vite build)
        run: pnpm run build

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title="eegfaktura-web"
            org.opencontainers.image.description="EEG Faktura web frontend (Customer)"
            org.opencontainers.image.source=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.url=${{ github.event.repository.html_url || '' }}
            org.opencontainers.image.version=${{ github.sha || '' }}
            org.opencontainers.image.revision=${{ github.sha || '' }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp || '' }}
            org.opencontainers.image.authors="eegfaktura@vfeeg.org"
            org.opencontainers.image.vendor="Verein zur Förderung von Erneuerbaren Energiegemeinschaften"
            org.opencontainers.image.licenses=${{ github.event.repository.license.spdx_id || '' }}
            org.opencontainers.image.ref.name=${{ github.ref || '' }}
            org.opencontainers.image.ref.sha=${{ github.sha || '' }}
            org.opencontainers.image.repository=${{ github.repository || '' }}

      - name: Login to Container Registry
        # PR-Builds duerfen nicht pushen — Login nur bei push.
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          # GITHUB_TOKEN darf nicht ins fremde vfeeg-development-Package pushen
          # (GHCR package-repo-binding -> denied). Classic-PAT mit write:packages.
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (PR) / Build and push (push)
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags || 'latest' }}
          labels: ${{ steps.meta.outputs.labels || '' }}
          annotations: ${{ steps.meta.outputs.annotations }}

      - name: Generate artifact attestation
        if: github.event_name == 'push'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
